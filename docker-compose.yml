name: vortex-insights

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vortex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vortex}
      POSTGRES_DB: ${POSTGRES_DB:-vortex_insights}
    ports:
      - "${POSTGRES_PORT:-5400}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vortex} -d ${POSTGRES_DB:-vortex_insights}"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:4
    restart: unless-stopped
    ports:
      - "8100:8080"
    depends_on:
      db:
        condition: service_healthy
    profiles: ["dev", "full"]

  worker:
    build:
      context: ./worker
    restart: unless-stopped
    env_file: .env
    environment:
      # Dentro do compose o host do Postgres é "db"
      DATABASE_URL: postgres://${POSTGRES_USER:-vortex}:${POSTGRES_PASSWORD:-vortex}@db:5432/${POSTGRES_DB:-vortex_insights}
      SCHEMA_PATH: /db/schema.sql
    volumes:
      - ./db:/db:ro
    depends_on:
      db:
        condition: service_healthy
    profiles: ["full"]

  app:
    build:
      context: ./app
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-vortex}:${POSTGRES_PASSWORD:-vortex}@db:5432/${POSTGRES_DB:-vortex_insights}
      NODE_ENV: production
      # Next.js standalone: sem isto, o server.js tenta bindar no hostname do
      # container (o ID hex) e morre com getaddrinfo EAI_AGAIN. Força 0.0.0.0.
      HOSTNAME: 0.0.0.0
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    profiles: ["full"]

volumes:
  pgdata:
